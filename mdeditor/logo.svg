<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="48" ry="48" fill="#f8fafc" stroke="#1e293b" stroke-width="12"/>
  <!-- Inner shadow rect -->
  <rect x="24" y="24" width="480" height="480" rx="48" ry="48" fill="none" stroke="#1e293b" stroke-width="6" transform="translate(4,4)" opacity="0.15"/>

  <!-- "M" letter -->
  <text x="130" y="330" font-family="'Vazirmatn', 'Inter', sans-serif" font-weight="900" font-size="240" fill="#1e293b" text-anchor="middle">M</text>

  <!-- "D" letter -->
  <text x="320" y="330" font-family="'Vazirmatn', 'Inter', sans-serif" font-weight="900" font-size="240" fill="#34d399" text-anchor="middle">D</text>

  <!-- Pen/edit icon overlay -->
  <g transform="translate(370, 90) rotate(25)">
    <rect x="0" y="0" width="36" height="180" rx="6" fill="#fbbf24" stroke="#1e293b" stroke-width="6"/>
    <polygon points="0,180 36,180 18,210" fill="#fbbf24" stroke="#1e293b" stroke-width="6" stroke-linejoin="round"/>
    <rect x="6" y="6" width="24" height="60" rx="3" fill="#1e293b" opacity="0.2"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="80" cy="420" r="12" fill="#f87171" stroke="#1e293b" stroke-width="4"/>
  <circle cx="115" cy="420" r="12" fill="#fbbf24" stroke="#1e293b" stroke-width="4"/>
  <circle cx="150" cy="420" r="12" fill="#34d399" stroke="#1e293b" stroke-width="4"/>
</svg>